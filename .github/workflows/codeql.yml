# Automatic security scan of TrustLight's code (GitHub CodeQL). Looks for common security
# mistakes in the Python server and the TypeScript website on every change and once a week.
# Results appear in the repository's Security tab. Free for public repositories.
name: Code security scan

on:
  push:
    branches: [main]
    paths-ignore: ["staysafe-full/accuracy/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
